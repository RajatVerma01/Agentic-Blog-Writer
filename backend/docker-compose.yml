version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog_writer_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
